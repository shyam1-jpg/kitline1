            },

              400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',
              800:'#1e293b',900:'#0f172a',950:'#020617'
            }
          },

  <!-- Chart.js for analytics -->

<body class="bg-ink-100 text-ink-900 font-sans antialiased">
  <noscript>
    <div style="max-width:480px;margin:2rem auto;padding:1.5rem;font-family:system-ui,sans-serif;text-align:center">
      <h1 style="color:#0f766e;font-size:1.5rem">Kiteline</h1>
      <p>JavaScript is required to run the kitchen app. Please enable JavaScript in your browser.</p>
      <p><a href="/" style="color:#0d9488;font-weight:bold">Back to kiteline.uk</a> &middot; <a href="mailto:contact@kiteline.uk" style="color:#0d9488">Contact support</a></p>
    </div>
  </noscript>
  <!-- App mounts here -->
  <div id="root">
    <div id="app-boot-fallback" class="min-h-screen flex items-center justify-center p-6" role="status" aria-live="polite">
      <div class="text-center max-w-sm">
        <p class="text-lg font-bold text-brand-700">Kiteline</p>
        <p class="text-ink-500 mt-2 text-sm">Loading kitchen app&hellip;</p>
        <p class="text-ink-400 mt-4 text-xs"><a href="/app#register" class="text-brand-600 font-semibold">Create account</a> &middot; <a href="/app" class="text-brand-600 font-semibold">Sign in</a></p>
      </div>
    </div>
  </div>

  <!-- Toast + modal layers -->
  <div id="toast-layer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>
  <div id="modal-layer" class="fixed inset-0 z-[90] hidden"></div>

  <!-- Auto-activate email verification links (works even if app.js is cached) -->
  <script>
  (function () {
    try {
      var h = location.hash || '';
      if (h.indexOf('#/') === 0) history.replaceState(null, '', location.pathname + '#' + h.slice(2));
      if (location.pathname === '/activate') return;
      var token = (location.search.match(/[?&]token=([^&]+)/) || h.match(/token=([^&]+)/) || [])[1];
      if (!token || h.indexOf('verify-email') < 0) return;
      fetch('/api/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, d: d }; });
      }).then(function (x) {
        if (x.ok && x.d && x.d.token) {
          localStorage.setItem('kiteline.token', x.d.token);
          if (x.d.user && x.d.user.email) localStorage.setItem('kiteline.email', x.d.user.email);
          location.replace('/app#home');
        }
      }).catch(function () {});
    } catch (e) {}
  })();
  </script>

  <!-- Bust stale service-worker / app shell when build changes -->
  <script>
  (function () {
    var build = '2026-07-01-compliance-print';
    try {
      if (localStorage.getItem('kiteline.build') !== build) {
        localStorage.setItem('kiteline.build', build);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
        }
      }
    } catch (e) {}
  })();
  </script>

  <!-- Scripts (classic, file:// friendly) -->
  <script src="/js/i18n.js?v=12"></script>
  <script src="/js/api.js?v=19"></script>
  <script src="/js/recipe-seeds.js?v=4"></script>
  <script src="/js/store.js?v=16"></script>
  <script src="/js/ui.js?v=14"></script>
  <script src="/js/security.js?v=1"></script>
  <script src="/js/compliance.js?v=4"></script>
  <script src="/js/recipe-nutrition.js?v=3"></script>
  <script src="/js/recipe-media.js?v=1"></script>
  <script src="/js/recipe-ai.js?v=2"></script>
  <script src="/js/register-form.js?v=6"></script>
  <script src="/js/views.js?v=26"></script>
  <script src="/js/compliance-views.js?v=4"></script>
  <script src="/js/app.js?v=31"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=42').catch(() => {});
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => {
            if (r.active && !String(r.active.scriptURL || '').includes('v=42')) r.unregister();
          });
        });
      });
    }
  </script>
