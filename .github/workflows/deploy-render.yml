# Trigger Render redeploy on every push to main.
# One-time setup in GitHub: Settings → Secrets → RENDER_DEPLOY_HOOK
# Get hook URL from Render → your service → Settings → Deploy Hook
name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: No deploy hook configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: |
          echo "Add RENDER_DEPLOY_HOOK in GitHub repo secrets to auto-deploy Render on push."
          echo "Render dashboard → kitline1 → Settings → Deploy Hook → copy URL"
