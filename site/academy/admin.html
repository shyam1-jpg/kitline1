<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff area</title>
<link rel="icon" type="image/png" href="kitline-academy-logo.png?v=1" />
<style>
:root{--bg:#070b18;--line:rgba(255,255,255,.12);--text:#f6f8ff;--muted:#aab4d6;--cyan:#36e6ff;--radius:24px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 8%,rgba(54,230,255,.14),transparent 30%),linear-gradient(180deg,#070b18,#0b1024);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;padding:28px 22px 60px;line-height:1.6}
h1{margin:0 0 8px;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em}
p{color:var(--muted);margin:0 0 12px}
.card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:var(--radius);padding:22px;margin:22px 0;max-width:920px}
input{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;width:100%;max-width:420px;margin:0 0 14px;display:block}
.btn{border:0;border-radius:999px;padding:12px 17px;cursor:pointer;font-weight:800;color:#061020;background:linear-gradient(135deg,var(--cyan),#7df0ff);margin-right:8px;margin-bottom:8px}
.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
a{color:var(--cyan);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}
#adminStudents{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.7}
#status{margin-top:12px;color:#ffca6b;font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<h1>Staff area</h1>
<p>Internal Kiteline Academy tools. This page is not linked from the public site.</p>
<p><a href="index.html">Back to Academy</a></p>
<div class="card">
  <label for="adminKey" style="display:block;color:var(--muted);font-size:14px;margin-bottom:8px">Admin key</label>
  <input id="adminKey" type="password" placeholder="Admin secret key" autocomplete="off" />
  <div>
    <button class="btn secondary" type="button" id="loadStudentsBtn">Load students</button>
    <button class="btn" type="button" id="exportCsvBtn">Export CSV</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="adminStudents"></div>
</div>
<script>
const API_BASE = "/api/academy";

function adminHeaders() {
  const key = document.getElementById("adminKey").value.trim();
  return key ? { "x-academy-admin": key } : {};
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg || "";
}

async function loadAdminStudents() {
  setStatus("Loading...");
  try {
    const r = await fetch(API_BASE + "/admin/students", {
      credentials: "include",
      headers: adminHeaders()
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "Failed to load students");
    const list = data.students || [];
    const el = document.getElementById("adminStudents");
    const rows = list.slice(0, 30).map(function (s) {
      return (s.email || "") + " · " + (s.country || "—") + (s.at ? " · " + s.at : "");
    }).join("<br>");
    el.innerHTML = "<b style=\"color:#fff\">" + list.length + " students</b>" +
      (data.storage ? " · storage: " + data.storage : "") + "<br><br>" + rows +
      (list.length > 30 ? "<br>..." : "");
    setStatus("");
  } catch (e) {
    document.getElementById("adminStudents").innerHTML = "";
    setStatus(e.message || "Error");
  }
}

async function exportAdminCsv() {
  setStatus("Exporting...");
  try {
    const r = await fetch(API_BASE + "/admin/export", {
      credentials: "include",
      headers: adminHeaders()
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || "Export failed");
    }
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kitline-academy-students.csv";
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus("CSV downloaded");
  } catch (e) {
    setStatus(e.message || "Export failed");
  }
}

document.getElementById("loadStudentsBtn").addEventListener("click", loadAdminStudents);
document.getElementById("exportCsvBtn").addEventListener("click", exportAdminCsv);
</script>
</body>
</html>
