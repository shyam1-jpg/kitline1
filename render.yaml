# Kiteline — deploy to Render (https://render.com)
# Connect this repo → Blueprint → kiteline.uk custom domain + free SSL
# Set APP_URL=https://kiteline.uk in Render env + Stripe webhook on /api/billing/webhook
services:
  - type: web
    name: kiteline
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    domains:
      - kiteline.uk
      - www.kiteline.uk
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: OWNER_EMAIL
        value: shyam_1@hotmail.co.uk
      - key: OWNER_NAME
        value: Shyam Prasad
      - key: OWNER_PASSWORD
        sync: false
      - key: INGEST_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: APP_URL
        value: https://kiteline.uk
      - key: DEMO_MODE
        value: "false"
      - key: REQUIRE_EMAIL_VERIFY
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: RECIPE_AI_ENABLED
        sync: false
      - key: RECIPE_AI_ADDON_GBP
        value: "12"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: dall-e-3
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VEDANTA_REPORT_EMAIL
        value: Operation@thevedanta.org
      - key: VEDANTA_FB_PROJECT
        value: the-vedanta
